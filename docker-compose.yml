services:
  source-manager:
    build: ./source-manager
    restart: unless-stopped
    environment:
      SOURCE_MANAGER_PASSWORD: ${SOURCE_MANAGER_PASSWORD:?Set SOURCE_MANAGER_PASSWORD in .env}
      DATA_PATH: /data/sources.json
      GENERATED_CONFIG: /app/config/user-sources.yml
    volumes:
      - ./config:/app/config
      - ./data:/data
    ports:
      - 8787:8787

  glance:
    container_name: glance
    image: glanceapp/glance
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
      # Optionally, also mount docker socket if you want to use the docker containers widget
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 8080:8080
    env_file: .env
